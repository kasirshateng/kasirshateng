<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SHATENG POS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- File CSS Terpisah -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex items-center justify-center h-screen">

    <div class="login-card space-y-6">
        <!-- Logo / Header -->
        <div class="text-center space-y-2">
            <h1 class="brand-title">KAFE SHATENG</h1>
            <p class="text-xs text-gray-500">Masukkan PIN Anda untuk masuk ke sistem</p>
        </div>

        <!-- Form Login -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">PIN Akses:</label>
                <input type="password" id="login-pin" placeholder="Masukkan PIN..." class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-amber-900 outline-none">
                
                <!-- Tempat Pesan Error Tampil di Bawah Input -->
                <p id="error-msg" class="text-xs text-red-600 mt-1.5 hidden font-medium"></p>
            </div>

            <button onclick="prosesLogin()" id="btn-login" class="w-full btn-primary font-bold py-3 rounded-lg shadow transition">
                Masuk Sistem
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzOj-GNILFwpKfAF1bnYT0YVyM4mOBzkdWM7qTrDryqFLVCj5w6ym_L3Xf-VanZPZ-9yg/exec";

        async function prosesLogin() {
            const pin = document.getElementById('login-pin').value;
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('error-msg');

            // Sembunyikan error sebelumnya
            errorMsg.classList.add('hidden');
            errorMsg.innerText = "";

            if (!pin) {
                errorMsg.innerText = "Silakan masukkan PIN terlebih dahulu!";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.innerText = "Memeriksa...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", pin: pin })
                });
                const result = await res.json();

                if (result.status === "success") {
                    localStorage.setItem("satheng_role", result.role);
                    localStorage.setItem("satheng_nama", result.nama);

                    if (result.role === "kasir") {
                        window.location.href = "kasir.html";
                    } else if (result.role === "owner") {
                        window.location.href = "owner.html";
                    } else {
                        errorMsg.innerText = "Role pengguna tidak dikenali.";
                        errorMsg.classList.remove('hidden');
                    }
                } else {
                    errorMsg.innerText = result.message || "PIN salah atau tidak ditemukan!";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = "Terjadi kesalahan koneksi ke database.";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerText = "Masuk Sistem";
                btn.disabled = false;
            }
        }

        // Tekan Enter untuk login
        document.getElementById('login-pin').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                prosesLogin();
            }
        });
    </script>
</body>
</html>

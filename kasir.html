<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - SATHENG POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- Bagian Kiri: Katalog Menu -->
        <div class="w-3/5 flex flex-col border-r border-gray-200 bg-white">
            <header class="bg-amber-900 text-white p-4 flex justify-between items-center shadow">
                <div class="flex items-center space-x-3">
                    <h1 class="text-xl font-bold">☕ KAFE SATHENG - Kasir</h1>
                    <span id="loader-status" class="text-xs bg-amber-800 px-2 py-1 rounded">Memuat Menu...</span>
                </div>
                <button onclick="logout()" class="bg-red-700 hover:bg-red-800 text-xs px-3 py-1.5 rounded font-semibold transition">Keluar</button>
            </header>
            <div class="p-4 overflow-y-auto flex-1 grid grid-cols-3 gap-3" id="menu-container">
                <!-- Menu dimuat otomatis dari Google Sheets -->
            </div>
        </div>

        <!-- Bagian Kanan: Keranjang & Pembayaran -->
        <div class="w-2/5 flex flex-col bg-gray-50">
            <div class="p-4 bg-white border-b border-gray-200 shadow-sm flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">Keranjang Pesanan</h2>
                <span id="kasir-nama" class="text-xs font-semibold text-gray-500 bg-gray-100 px-2.5 py-1 rounded-full">Kasir</span>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-2" id="cart-items">
                <p class="text-gray-400 text-center py-10">Keranjang masih kosong</p>
            </div>

            <div class="p-4 bg-white border-t border-gray-200 shadow-lg space-y-3">
                <div class="flex justify-between text-lg font-bold text-gray-800">
                    <span>Total:</span>
                    <span id="grand-total">Rp 0</span>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Metode Pembayaran:</label>
                    <select id="payment-method" class="w-full border rounded p-2 text-sm bg-white focus:ring-2 focus:ring-amber-900 outline-none">
                        <option value="Tunai">Tunai</option>
                        <option value="QRIS">QRIS</option>
                        <option value="Transfer">Transfer</option>
                    </select>
                </div>

                <div>
                    <input type="text" id="order-note" placeholder="Catatan pesanan (misal: Meja 5)" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-amber-900 outline-none">
                </div>

                <button onclick="prosesBayar()" id="btn-bayar" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition disabled:opacity-50" disabled>
                    Proses Pembayaran
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Sukses Transaksi Modern -->
    <div id="modal-success" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm text-center space-y-4 shadow-2xl transform transition-all">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">
                ✓
            </div>
            <div>
                <h3 class="text-xl font-bold text-gray-800">Transaksi Berhasil!</h3>
                <p class="text-xs text-gray-500 mt-1">Data pesanan telah tercatat di database.</p>
            </div>
            <button onclick="tutupModalSukses()" class="w-full bg-amber-900 hover:bg-amber-800 text-white font-bold py-2.5 rounded-xl shadow transition text-sm">
                Kembali ke Menu
            </button>
        </div>
    </div>

    <script>
        // Cek Keamanan Sesi Login & Peran
        if (localStorage.getItem("satheng_role") !== "kasir") {
            window.location.href = "index.html";
        }

        const namaKasir = localStorage.getItem("satheng_nama");
        if (namaKasir) {
            document.getElementById('kasir-nama').innerText = `Kasir: ${namaKasir}`;
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbzOj-GNILFwpKfAF1bnYT0YVyM4mOBzkdWM7qTrDryqFLVCj5w6ym_L3Xf-VanZPZ-9yg/exec";
        let menuList = [];
        let cart = [];

        async function loadMenu() {
            try {
                const res = await fetch(`${API_URL}?action=menu`);
                menuList = await res.json();
                renderMenu();
                document.getElementById('loader-status').innerText = 'Online';
                document.getElementById('loader-status').className = 'text-xs bg-emerald-700 px-2 py-1 rounded';
            } catch (err) {
                document.getElementById('loader-status').innerText = 'Gagal Memuat';
                document.getElementById('loader-status').className = 'text-xs bg-red-700 px-2 py-1 rounded';
            }
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            if (menuList.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-sm col-span-3 text-center py-10">Belum ada menu di database.</p>';
                return;
            }

            menuList.forEach(item => {
                if(item.Status !== "Tersedia") return;
                container.innerHTML += `
                    <div onclick='tambahKeKeranjang("${item.ID_Menu}")' class="bg-white border rounded-xl p-3 shadow-sm hover:shadow-md cursor-pointer flex flex-col justify-between transition border-amber-100 hover:border-amber-400">
                        <div>
                            <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold">${item.Kategori}</span>
                            <h3 class="font-bold text-gray-800 mt-2 text-sm leading-snug">${item.Nama_Menu}</h3>
                        </div>
                        <p class="text-amber-900 font-extrabold mt-3 text-sm">Rp ${Number(item.Harga).toLocaleString('id-ID')}</p>
                    </div>
                `;
            });
        }

        function tambahKeKeranjang(id) {
            const produk = menuList.find(m => m.ID_Menu === id);
            const itemExist = cart.find(i => i.ID_Menu === id);
            if(itemExist) {
                itemExist.qty += 1;
            } else {
                cart.push({ ...produk, qty: 1 });
            }
            renderCart();
        }

        function ubahQty(id, delta) {
            const item = cart.find(i => i.ID_Menu === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) {
                    cart = cart.filter(i => i.ID_Menu !== id);
                }
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const btnBayar = document.getElementById('btn-bayar');
            
            if(cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-10">Keranjang masih kosong</p>';
                document.getElementById('grand-total').innerText = 'Rp 0';
                btnBayar.disabled = true;
                return;
            }

            container.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                const subtotal = item.Harga * item.qty;
                total += subtotal;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-3 rounded-lg border shadow-sm">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm text-gray-800">${item.Nama_Menu}</h4>
                            <p class="text-xs text-gray-500">Rp ${Number(item.Harga).toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="ubahQty('${item.ID_Menu}', -1)" class="bg-gray-200 px-2 py-1 rounded text-xs font-bold w-6 h-6 flex items-center justify-center">-</button>
                            <span class="text-sm font-bold w-6 text-center">${item.qty}</span>
                            <button onclick="ubahQty('${item.ID_Menu}', 1)" class="bg-gray-200 px-2 py-1 rounded text-xs font-bold w-6 h-6 flex items-center justify-center">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('grand-total').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            btnBayar.disabled = false;
        }

        async function prosesBayar() {
            const btn = document.getElementById('btn-bayar');
            btn.innerText = "Memproses...";
            btn.disabled = true;

            const detailString = cart.map(i => `${i.Nama_Menu} (x${i.qty})`).join(", ");
            const totalHarga = cart.reduce((sum, i) => sum + (i.Harga * i.qty), 0);
            const metodeBayar = document.getElementById('payment-method').value;
            const catatan = document.getElementById('order-note').value;

            const payload = {
                action: "add_transaksi",
                detail_item: detailString,
                total_harga: totalHarga,
                metode_bayar: metodeBayar,
                catatan: catatan
            };

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if(result.status === "success") {
                    // Tampilkan modal sukses modern alih-alih alert
                    document.getElementById('modal-success').classList.remove('hidden');
                    cart = [];
                    document.getElementById('order-note').value = "";
                    renderCart();
                } else {
                    alert("Gagal memproses transaksi.");
                }
            } catch (err) {
                alert("Terjadi kesalahan koneksi ke server.");
            } finally {
                btn.innerText = "Proses Pembayaran";
                btn.disabled = false;
            }
        }

        function tutupModalSukses() {
            document.getElementById('modal-success').classList.add('hidden');
        }

        loadMenu();
    </script>
</body>
</html>

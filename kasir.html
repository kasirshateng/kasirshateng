
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - SATHENG POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* MODAL SUKSES */
        #modal-success {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        #modal-success.show {
            display: flex;
        }

        /* AREA STRUK */
        #print-area {
            display: none;
        }

        @media print {
            @page {
                size: 80mm auto;
                margin: 4mm;
            }

            body {
                background: white !important;
            }

            body * {
                visibility: hidden !important;
            }

            #print-area,
            #print-area * {
                visibility: visible !important;
            }

            #print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 72mm;
                color: #000;
                background: #fff;
                font-family: monospace;
                font-size: 11px;
            }

            .receipt-center {
                text-align: center;
            }

            .receipt-row {
                display: flex;
                justify-content: space-between;
                gap: 8px;
            }

            .receipt-divider {
                border-top: 1px dashed #000;
                margin: 8px 0;
            }
        }
    </style>
</head>

<body class="bg-gray-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">

        <!-- KATALOG MENU -->
        <div class="w-3/5 flex flex-col border-r border-gray-200 bg-white">

            <header class="bg-amber-900 text-white p-4 flex justify-between items-center shadow">
                <div class="flex items-center space-x-3">
                    <h1 class="text-xl font-bold">☕ KAFE SATHENG - Kasir</h1>
                    <span id="loader-status" class="text-xs bg-amber-800 px-2 py-1 rounded">
                        Memuat Menu...
                    </span>
                </div>

                <button onclick="logout()"
                    class="bg-red-700 hover:bg-red-800 text-xs px-3 py-1.5 rounded font-semibold transition">
                    Keluar
                </button>
            </header>

            <div class="p-4 overflow-y-auto flex-1 grid grid-cols-3 gap-3"
                id="menu-container">
            </div>

        </div>

        <!-- KERANJANG DAN PEMBAYARAN -->
        <div class="w-2/5 flex flex-col bg-gray-50">

            <div class="p-4 bg-white border-b border-gray-200 shadow-sm flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">Keranjang Pesanan</h2>

                <span id="kasir-nama"
                    class="text-xs font-semibold text-gray-500 bg-gray-100 px-2.5 py-1 rounded-full">
                    Kasir
                </span>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-2" id="cart-items">
                <p class="text-gray-400 text-center py-10">
                    Keranjang masih kosong
                </p>
            </div>

            <!-- PEMBAYARAN -->
            <div class="p-4 bg-white border-t border-gray-200 shadow-lg space-y-3">

                <div class="flex justify-between text-lg font-bold text-gray-800">
                    <span>Total:</span>
                    <span id="grand-total">Rp 0</span>
                </div>

                <!-- METODE PEMBAYARAN -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">
                        Metode Pembayaran:
                    </label>

                    <select id="payment-method"
                        onchange="aturMetodePembayaran()"
                        class="w-full border rounded p-2 text-sm bg-white focus:ring-2 focus:ring-amber-900 outline-none">

                        <option value="Tunai">Tunai</option>
                        <option value="QRIS">QRIS</option>
                        <option value="Transfer">Transfer</option>

                    </select>
                </div>

                <!-- PEMBAYARAN TUNAI -->
                <div id="cash-payment-fields" class="space-y-2">

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">
                            Nominal Uang Dibayarkan:
                        </label>

                        <input
                            type="number"
                            id="nominal-bayar"
                            min="0"
                            step="500"
                            inputmode="numeric"
                            placeholder="Masukkan nominal uang"
                            oninput="hitungKembalian()"
                            class="w-full border rounded-lg p-3 text-lg font-bold focus:ring-2 focus:ring-amber-900 outline-none"
                        >
                    </div>

                    <div class="flex justify-between items-center bg-emerald-50 border border-emerald-200 rounded-lg p-3">
                        <span class="text-sm font-semibold text-gray-700">
                            Kembalian:
                        </span>

                        <span id="nominal-kembalian"
                            class="text-lg font-extrabold text-emerald-700">
                            Rp 0
                        </span>
                    </div>

                    <p id="cash-warning" class="text-xs text-red-600 hidden">
                        Nominal pembayaran masih kurang dari total belanja.
                    </p>

                </div>

                <!-- CATATAN -->
                <div>
                    <input
                        type="text"
                        id="order-note"
                        placeholder="Catatan pesanan (misal: Meja 5)"
                        class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-amber-900 outline-none"
                    >
                </div>

                <!-- TOMBOL BAYAR -->
                <button
                    onclick="prosesBayar()"
                    id="btn-bayar"
                    type="button"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled>
                    Proses Pembayaran
                </button>

            </div>
        </div>
    </div>


    <!-- MODAL TRANSAKSI BERHASIL -->
    <div id="modal-success">

        <div class="bg-white p-6 rounded-2xl w-full max-w-sm text-center space-y-4 shadow-2xl">

            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">
                ✓
            </div>

            <div>
                <h3 class="text-xl font-bold text-gray-800">
                    Transaksi Berhasil!
                </h3>

                <p class="text-xs text-gray-500 mt-1">
                    Data pesanan telah tercatat di database.
                </p>
            </div>

            <button
                type="button"
                onclick="cetakNota()"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow transition text-sm">
                Cetak Struk
            </button>

            <button
                type="button"
                onclick="tutupModalSukses()"
                class="w-full bg-amber-900 hover:bg-amber-800 text-white font-bold py-2.5 rounded-xl shadow transition text-sm">
                Tidak, Kembali ke Menu
            </button>

        </div>
    </div>


    <!-- AREA CETAK STRUK -->
    <div id="print-area"></div>


    <script>
        // ==========================================
        // KEAMANAN LOGIN
        // ==========================================

        if (localStorage.getItem("satheng_role") !== "kasir") {
            window.location.href = "index.html";
        }

        const namaKasir = localStorage.getItem("satheng_nama");

        if (namaKasir) {
            document.getElementById('kasir-nama').innerText =
                `Kasir: ${namaKasir}`;
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }


        // ==========================================
        // KONFIGURASI API
        // ==========================================

        const API_URL = "https://script.google.com/macros/s/AKfycbzOj-GNILFwpKfAF1bnYT0YVyM4mOBzkdWM7qTrDryqFLVCj5w6ym_L3Xf-VanZPZ-9yg/exec";

        let menuList = [];
        let cart = [];
        let lastTransactionData = null;


        // ==========================================
        // FORMAT RUPIAH
        // ==========================================

        function formatRupiah(angka) {
            return 'Rp ' + Number(angka || 0).toLocaleString('id-ID');
        }


        // ==========================================
        // TOTAL KERANJANG
        // ==========================================

        function getTotalHarga() {
            return cart.reduce((sum, item) => {
                return sum + (Number(item.Harga) * item.qty);
            }, 0);
        }


        // ==========================================
        // LOAD MENU
        // ==========================================

        async function loadMenu() {
            try {
                const res = await fetch(`${API_URL}?action=menu`);

                menuList = await res.json();

                renderMenu();

                document.getElementById('loader-status').innerText = 'Online';

                document.getElementById('loader-status').className =
                    'text-xs bg-emerald-700 px-2 py-1 rounded';

            } catch (err) {

                console.error(err);

                document.getElementById('loader-status').innerText = 'Gagal Memuat';

                document.getElementById('loader-status').className =
                    'text-xs bg-red-700 px-2 py-1 rounded';

            }
        }


        // ==========================================
        // TAMPILKAN MENU
        // ==========================================

        function renderMenu() {
            const container = document.getElementById('menu-container');

            container.innerHTML = '';

            if (menuList.length === 0) {
                container.innerHTML = `
                    <p class="text-gray-400 text-sm col-span-3 text-center py-10">
                        Belum ada menu di database.
                    </p>
                `;
                return;
            }

            menuList.forEach(item => {

                if (item.Status !== "Tersedia") return;

                container.innerHTML += `
                    <div
                        onclick='tambahKeKeranjang("${item.ID_Menu}")'
                        class="bg-white border rounded-xl p-3 shadow-sm hover:shadow-md cursor-pointer flex flex-col justify-between transition border-amber-100 hover:border-amber-400">

                        <div>
                            <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold">
                                ${item.Kategori}
                            </span>

                            <h3 class="font-bold text-gray-800 mt-2 text-sm leading-snug">
                                ${item.Nama_Menu}
                            </h3>
                        </div>

                        <p class="text-amber-900 font-extrabold mt-3 text-sm">
                            ${formatRupiah(item.Harga)}
                        </p>

                    </div>
                `;
            });
        }


        // ==========================================
        // TAMBAH MENU KE KERANJANG
        // ==========================================

        function tambahKeKeranjang(id) {

            const produk = menuList.find(m => m.ID_Menu === id);

            if (!produk) return;

            const itemExist = cart.find(i => i.ID_Menu === id);

            if (itemExist) {
                itemExist.qty += 1;
            } else {
                cart.push({
                    ...produk,
                    qty: 1
                });
            }

            renderCart();
        }


        // ==========================================
        // UBAH JUMLAH MENU
        // ==========================================

        function ubahQty(id, delta) {

            const item = cart.find(i => i.ID_Menu === id);

            if (item) {

                item.qty += delta;

                if (item.qty <= 0) {
                    cart = cart.filter(i => i.ID_Menu !== id);
                }

            }

            renderCart();
        }


        // ==========================================
        // RENDER KERANJANG
        // ==========================================

        function renderCart() {

            const container = document.getElementById('cart-items');

            if (cart.length === 0) {

                container.innerHTML = `
                    <p class="text-gray-400 text-center py-10">
                        Keranjang masih kosong
                    </p>
                `;

                document.getElementById('grand-total').innerText = 'Rp 0';

                document.getElementById('nominal-bayar').value = '';
                document.getElementById('nominal-kembalian').innerText = 'Rp 0';
                document.getElementById('cash-warning').classList.add('hidden');

                document.getElementById('btn-bayar').disabled = true;

                return;
            }

            container.innerHTML = '';

            let total = 0;

            cart.forEach(item => {

                const subtotal = Number(item.Harga) * item.qty;

                total += subtotal;

                container.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-3 rounded-lg border shadow-sm">

                        <div class="flex-1">
                            <h4 class="font-bold text-sm text-gray-800">
                                ${item.Nama_Menu}
                            </h4>

                            <p class="text-xs text-gray-500">
                                ${formatRupiah(item.Harga)} x ${item.qty}
                            </p>
                        </div>

                        <div class="flex items-center space-x-2">

                            <button
                                onclick="ubahQty('${item.ID_Menu}', -1)"
                                class="bg-gray-200 px-2 py-1 rounded text-xs font-bold w-6 h-6 flex items-center justify-center">
                                -
                            </button>

                            <span class="text-sm font-bold w-6 text-center">
                                ${item.qty}
                            </span>

                            <button
                                onclick="ubahQty('${item.ID_Menu}', 1)"
                                class="bg-gray-200 px-2 py-1 rounded text-xs font-bold w-6 h-6 flex items-center justify-center">
                                +
                            </button>

                        </div>

                    </div>
                `;
            });

            document.getElementById('grand-total').innerText =
                formatRupiah(total);

            aturMetodePembayaran();
        }


        // ==========================================
        // METODE PEMBAYARAN
        // ==========================================

        function aturMetodePembayaran() {

            const metode = document.getElementById('payment-method').value;

            const cashFields = document.getElementById('cash-payment-fields');

            if (metode === 'Tunai') {

                cashFields.classList.remove('hidden');

                hitungKembalian();

            } else {

                cashFields.classList.add('hidden');

                document.getElementById('cash-warning').classList.add('hidden');

                document.getElementById('btn-bayar').disabled =
                    cart.length === 0;

            }
        }


        // ==========================================
        // HITUNG KEMBALIAN
        // ==========================================

        function hitungKembalian() {

            const total = getTotalHarga();

            const nominalBayar = Number(
                document.getElementById('nominal-bayar').value
            ) || 0;

            const kembalian = nominalBayar - total;

            const warning = document.getElementById('cash-warning');

            const btnBayar = document.getElementById('btn-bayar');

            document.getElementById('nominal-kembalian').innerText =
                formatRupiah(Math.max(0, kembalian));

            const uangKurang = nominalBayar < total;

            if (uangKurang && nominalBayar > 0) {
                warning.classList.remove('hidden');
            } else {
                warning.classList.add('hidden');
            }

            btnBayar.disabled =
                cart.length === 0 ||
                nominalBayar < total ||
                nominalBayar <= 0;
        }


        // ==========================================
        // SIMPAN DATA STRUK
        // ==========================================

        function simpanDataStruk() {

            const metode = document.getElementById('payment-method').value;

            const total = getTotalHarga();

            const bayar = metode === 'Tunai'
                ? Number(document.getElementById('nominal-bayar').value) || 0
                : total;

            lastTransactionData = {

                items: cart.map(item => ({
                    nama: item.Nama_Menu,
                    harga: Number(item.Harga),
                    qty: item.qty,
                    subtotal: Number(item.Harga) * item.qty
                })),

                total: total,
                bayar: bayar,

                kembalian: metode === 'Tunai'
                    ? bayar - total
                    : 0,

                metode: metode,

                catatan: document.getElementById('order-note').value || '-',

                waktu: new Date().toLocaleString('id-ID', {
                    timeZone: 'Asia/Jakarta'
                }),

                kasir: namaKasir || 'Kasir'
            };
        }


        // ==========================================
        // PROSES PEMBAYARAN
        // ==========================================

        async function prosesBayar() {

            const btn = document.getElementById('btn-bayar');

            const detailString = cart.map(i => {
                return `${i.Nama_Menu} (x${i.qty})`;
            }).join(", ");

            const totalHarga = getTotalHarga();

            const metodeBayar = document.getElementById('payment-method').value;

            const nominalDibayar = Number(
                document.getElementById('nominal-bayar').value
            ) || 0;

            const catatan = document.getElementById('order-note').value;

            if (cart.length === 0) {
                alert('Keranjang masih kosong.');
                return;
            }

            // Validasi pembayaran tunai
            if (metodeBayar === 'Tunai' && nominalDibayar < totalHarga) {
                alert('Nominal pembayaran kurang dari total belanja.');
                hitungKembalian();
                return;
            }

            btn.innerText = "Memproses...";
            btn.disabled = true;

            const payload = {
                action: "add_transaksi",
                detail_item: detailString,
                total_harga: totalHarga,
                metode_bayar: metodeBayar,
                catatan: catatan
            };

            try {

                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (result.status === "success") {

                    // Simpan data struk sebelum keranjang dikosongkan
                    simpanDataStruk();

                    // Tampilkan modal transaksi sukses
                    bukaModalSukses();

                    // Reset keranjang
                    cart = [];

                    document.getElementById('order-note').value = '';
                    document.getElementById('nominal-bayar').value = '';
                    document.getElementById('nominal-kembalian').innerText = 'Rp 0';

                    renderCart();

                } else {

                    alert("Gagal memproses transaksi.");

                }

            } catch (err) {

                console.error(err);

                alert("Terjadi kesalahan koneksi ke server.");

            } finally {

                btn.innerText = "Proses Pembayaran";

                btn.disabled = cart.length === 0;

                if (cart.length > 0) {
                    aturMetodePembayaran();
                }

            }
        }


        // ==========================================
        // MODAL TRANSAKSI SUKSES
        // ==========================================

        function bukaModalSukses() {

            document.getElementById('modal-success').classList.add('show');

            document.body.style.overflow = 'hidden';
        }

        function tutupModalSukses() {

            document.getElementById('modal-success').classList.remove('show');

            document.body.style.overflow = '';
        }


        // ==========================================
        // CETAK STRUK
        // ==========================================

        function cetakNota() {

            if (!lastTransactionData) {
                alert('Data struk tidak ditemukan.');
                return;
            }

            const data = lastTransactionData;

            let daftarItem = '';

            data.items.forEach(item => {

                daftarItem += `
                    <div style="margin-bottom:8px;">
                        <div>${item.nama}</div>

                        <div class="receipt-row">
                            <span>${item.qty} x ${formatRupiah(item.harga)}</span>
                            <span>${formatRupiah(item.subtotal)}</span>
                        </div>
                    </div>
                `;

            });

            document.getElementById('print-area').innerHTML = `

                <div class="receipt-center">

                    <h2 style="font-size:18px;font-weight:bold;margin-bottom:4px;">
                        KAFE SATHENG
                    </h2>

                    <div>Struk Pembayaran</div>

                </div>

                <div class="receipt-divider"></div>

                <div>Tanggal: ${data.waktu}</div>
                <div>Kasir: ${data.kasir}</div>
                <div>Metode: ${data.metode}</div>

                <div class="receipt-divider"></div>

                ${daftarItem}

                <div class="receipt-divider"></div>

                <div class="receipt-row">
                    <strong>TOTAL</strong>
                    <strong>${formatRupiah(data.total)}</strong>
                </div>

                <div class="receipt-row">
                    <span>Bayar</span>
                    <span>${formatRupiah(data.bayar)}</span>
                </div>

                <div class="receipt-row">
                    <strong>Kembalian</strong>
                    <strong>${formatRupiah(data.kembalian)}</strong>
                </div>

                ${data.catatan !== '-' ? `
                    <div class="receipt-divider"></div>
                    <div>Catatan: ${data.catatan}</div>
                ` : ''}

                <div class="receipt-divider"></div>

                <div class="receipt-center" style="margin-top:12px;">
                    Terima kasih atas kunjungan Anda
                    <br>
                    Selamat menikmati!
                </div>

            `;

            tutupModalSukses();

            window.print();
        }


        // ==========================================
        // MULAI APLIKASI
        // ==========================================

        aturMetodePembayaran();

        loadMenu();

    </script>

</body>
</html>
